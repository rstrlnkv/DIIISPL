# Сборка выпуска. Запускается тегом вида v0.1.0 — он же задаёт и версию, и канал:
# держать их ещё и в файлах значит однажды выпустить 0.1.1 с надписью 0.1.0.
#
# Тег с суффиксом (v0.1.1-dev.1) — сборка Dev: уезжает предварительным выпуском,
# программа берёт такие только на канале Dev, и только в них есть настройки
# панели задач. Тег без суффикса — стабильная сборка, без них.
name: Выпуск

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Версия без «v», например 0.1.1 или 0.1.1-dev.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    # На уровне задачи — только признак «ключ есть», строка «true» или «false»,
    # но не сам ключ. Переменная задачи видна каждому шагу, а среди шагов есть
    # такой, который качает nuget.exe по ссылке «latest» без сверки хеша и
    # запускает сборочные скрипты чужих портов. Ключ подписи там делать нечего:
    # им подписывается всё, что программа готова поставить себе с правами.
    #
    # Сам секрет объявлен ниже, в единственном шаге, которому он нужен. Условие
    # шага секретов не видит — отсюда и признак.
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGN_PFX != '' }}

    steps:
      # Вся история, а не последний коммит: номер сборки — это их число, и при
      # выкачке глубиной в один у каждого выпуска он был бы «1».
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Версия
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' }
                     else { $tag -replace '^v','' }
          $number = ($version -split '-')[0]          # 0.1.1-dev.1 → 0.1.1
          if ($number -notmatch '^\d+\.\d+\.\d+$') { throw "Непонятная версия: $version" }
          $early = $version -match '-'

          # Тег задаёт и канал. Суффикс — сборка Dev: в ней есть настройки панели
          # задач и библиотека оформления; в стабильной их нет вовсе.
          #
          # Ниже именно ToString().ToLower(): PowerShell пишет булево как «True», а
          # действие выпуска сравнивает строку с «true» — с заглавной буквы
          # предварительный выпуск не пометится предварительным и уйдёт всем,
          # включая тех, кто канал Dev не выбирал.
          $channel = if ($early) { 'dev' } else { 'stable' }

          "DIIISPL_VERSION=$number"                      | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DIIISPL_TAG=$version"                         | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DIIISPL_CHANNEL=$channel"                     | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DIIISPL_EARLY=$($early.ToString().ToLower())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          # версия внутри программы — та же, что в теге
          $file = 'AssemblyInfo.cs'
          $text = Get-Content $file -Raw
          $text = $text -replace 'AssemblyVersion\("[^"]*"\)',     "AssemblyVersion(`"$number.0`")"
          $text = $text -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$number.0`")"
          Set-Content $file $text -Encoding utf8
          Write-Host "Собираю $version"

      # Только для сборок Dev: в стабильной библиотеки нет ни в программе, ни в
      # пакете, и тратить на неё минуты незачем. Собирается из исходников —
      # detours и wil тянет vcpkg, поэтому шаг долгий. Кэш сюда не поставлен
      # намеренно: build-native.cmd раскладывает промежуточные файлы во временную
      # папку, путь к которой у сборщика свой, и ключ кэша указывал бы мимо.
      - name: Библиотека оформления панели задач
        if: ${{ env.DIIISPL_CHANNEL == 'dev' }}
        run: native\build-native.cmd

      # Сертификат самодельный и в репозиторий не попадает. Есть в секретах —
      # подписываем; нет — собираем без подписи, но такой выпуск программа
      # у себя не поставит: она сверяет подпись с известным отпечатком.
      - name: Сертификат подписи
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_PFX)
          $path  = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          $password = ConvertTo-SecureString $env:SIGN_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $path -Force
          "DIIISPL_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # «.\» обязательна. У шагов run на windows-раннере оболочка — PowerShell,
      # а он принципиально не ищет исполняемые файлы в текущем каталоге: голое
      # «build.cmd» кончается «The term is not recognized». Соседние шаги живы
      # только потому, что в их строках есть разделитель пути, и PowerShell
      # считает их относительным путём.
      - name: Программа
        run: .\build.cmd ${{ env.DIIISPL_CHANNEL }}

      - name: Установщик
        run: .\installer\build-msi.cmd ${{ env.DIIISPL_CHANNEL }}

      # Выпуск без подписи программа у себя не поставит: она сверяет установщик
      # с известным отпечатком. Собирается он при этом до конца и зеленеет —
      # поэтому проверяем здесь, до публикации, а не после жалобы пользователя.
      - name: Пакет подписан
        shell: pwsh
        run: |
          $msi = "DIIISPL-$env:DIIISPL_VERSION-$env:DIIISPL_CHANNEL-x64.msi"
          $sig = Get-AuthenticodeSignature $msi

          # Смотрим на сертификат, а не на Status: корень самоподписанный, и
          # Get-AuthenticodeSignature на правильно подписанном пакете отвечает
          # UnknownError. Проверка по Status валила бы каждый выпуск.
          if ($sig.SignerCertificate -eq $null) {
            throw "Пакет $msi собран без подписи — такой выпуск программа не поставит."
          }

          # И отпечаток тот самый. Программа сверяет установщик именно с ним
          # (Updater.cs), поэтому подписанный чужим ключом выпуск она отвергнет —
          # а сборка без этой проверки позеленела бы и опубликовала его.
          $want = '103850469089DEECC19D0DD6CE1D4DD3307601FA'
          if ($sig.SignerCertificate.Thumbprint -ne $want) {
            throw "Пакет подписан ключом $($sig.SignerCertificate.Thumbprint), а программа ждёт $want."
          }
          Write-Host "Подписан: $($sig.SignerCertificate.Thumbprint)"

      # Описание выпуска собирается здесь, а не в шаге ниже: сверху — раздел
      # собираемой версии из CHANGELOG.md и CHANGELOG.en.md, под ним — неизменный
      # рассказ о программе на тех же двух языках. Кнопка «Что нового» из окна
      # ведёт именно на эту страницу, и первым человек должен увидеть то, за чем
      # пришёл, а не то, что не менялось с прошлого раза.
      #
      # Нет раздела хотя бы в одном языке — падаем здесь. Выпуск без «что нового»
      # создался бы молча и позеленел бы, а нашёлся бы только глазами человека,
      # пришедшего читать, — и переписывать пришлось бы уже опубликованное.
      - name: Что нового
        shell: pwsh
        run: |
          function Section([string]$file, [string]$version) {
            if (-not (Test-Path $file)) { throw "Нет файла $file." }
            $found = $false
            $lines = New-Object System.Collections.Generic.List[string]
            foreach ($line in (Get-Content $file -Encoding utf8)) {
              # Заголовок раздела — «## 0.1.3-dev.1 — 2026-08-21»; сверяем первое слово.
              if ($line -match '^##\s+(\S+)') {
                if ($found) { break }
                if ($Matches[1] -eq $version) { $found = $true }
                continue
              }
              if ($found) { $lines.Add($line) }
            }
            if (-not $found) { throw "В $file нет раздела «$version» — впишите его до того, как ставить тег." }
            $text = ($lines -join "`n").Trim()
            if ($text -eq '') { throw "Раздел «$version» в $file пуст." }
            return $text
          }

          $tag = $env:DIIISPL_TAG
          $msi = "DIIISPL-$env:DIIISPL_VERSION-$env:DIIISPL_CHANNEL-x64.msi"
          $aboutRu = (Get-Content '.github/release-about.ru.md' -Raw -Encoding utf8).Replace('{MSI}', $msi).Trim()
          $aboutEn = (Get-Content '.github/release-about.en.md' -Raw -Encoding utf8).Replace('{MSI}', $msi).Trim()

          $body = @(
            "## Что нового в $tag", '', (Section 'CHANGELOG.md'    $tag), '',
            "## What's new in $tag", '', (Section 'CHANGELOG.en.md' $tag), '',
            '---', '', $aboutRu, '',
            '---', '', $aboutEn
          ) -join "`n"

          Set-Content release-body.md $body -Encoding utf8
          Write-Host $body

      - name: Выпуск
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DIIISPL_TAG }}
          # Заголовок называет канал: на эту страницу ведёт кнопка «Что нового»
          # из окна программы, а суффикс «-dev.1» в теге прочитают не все.
          name: ${{ env.DIIISPL_CHANNEL == 'dev' && format('{0} · Dev — с панелью задач', env.DIIISPL_TAG) || env.DIIISPL_TAG }}
          prerelease: ${{ env.DIIISPL_EARLY }}
          # Описание пишем своё, шагом выше: generate_release_notes собирает текст
          # из слитых pull request'ов — у нас их нет, и страница встретила бы
          # человека пустой строчкой. Сгенерированное допишется следом, одно
          # другому не мешает.
          body_path: release-body.md
          generate_release_notes: true
          files: DIIISPL-${{ env.DIIISPL_VERSION }}-${{ env.DIIISPL_CHANNEL }}-x64.msi
          # Без этого выпуск без пакета создаётся молча и шаг зеленеет. А выпуск
          # без пакета программа не поставит: она ищет вложение с «.msi».
          fail_on_unmatched_files: true
