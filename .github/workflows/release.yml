# Release build. Triggered by a tag like v0.1.0, which sets both the version and the channel.
# Version files are not patched here: the "Version" step fails the release when
# AssemblyInfo.cs or the CHANGELOG headings disagree with the tag.
#
# A tag with a suffix (v0.1.1-dev.1) is a Dev build: it goes out as a pre-release,
# the program takes those only on the Dev channel, and only they have the
# taskbar settings. A tag without a suffix is a stable build, without them.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without "v", for example 0.1.1 or 0.1.1-dev.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    # At job level there is only the "key is present" flag, the string "true" or "false",
    # not the key itself. A job variable is visible to every step, and among the steps there is
    # one that downloads nuget.exe from the "latest" link without a hash check and
    # runs the build scripts of third-party ports. The signing key has no business there:
    # it signs everything the program is ready to install for itself with privileges.
    #
    # The secret itself is declared below, in the one step that needs it. A step's condition
    # cannot see secrets, hence the flag.
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGN_PFX != '' }}

    steps:
      # The whole history, not the last commit: the build number is their count, and with
      # a depth-one checkout it would be "1" for every release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        shell: pwsh
        # Tag and input text reach the script through env, never spliced into its source.
        env:
          GH_REF: ${{ github.ref_name }}
          GH_INPUT_VERSION: ${{ inputs.version }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          $tag = $env:GH_REF
          $version = if ($env:GH_EVENT -eq 'workflow_dispatch') { $env:GH_INPUT_VERSION }
                     else { $tag -replace '^v','' }
          # Whole version, suffix included: it goes on into GITHUB_ENV and file names.
          if ($version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?\z') { throw "Unrecognized version: $version" }
          $number = ($version -split '-')[0]          # 0.1.1-dev.1 → 0.1.1
          $early = $version -match '-'

          # The tag sets the channel too. A suffix means a Dev build: it has the taskbar
          # settings and the styling library; the stable one has none at all.
          #
          # Below it is ToString().ToLower() on purpose: PowerShell writes a boolean as "True", and
          # the release action compares the string with "true"; with a capital letter
          # the pre-release would not be marked as a pre-release and would go to everyone,
          # including those who did not choose the Dev channel.
          $channel = if ($early) { 'dev' } else { 'stable' }

          "DIIISPL_VERSION=$number"                      | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DIIISPL_TAG=$version"                         | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DIIISPL_CHANNEL=$channel"                     | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DIIISPL_EARLY=$($early.ToString().ToLower())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          # The tagged commit must already carry the tag's version (Core
          # standards/versioning.md rule 7): check it, never patch it here.
          $asm = Get-Content 'src/AssemblyInfo.cs' -Raw
          foreach ($name in 'AssemblyVersion', 'AssemblyFileVersion') {
            if ($asm -notmatch ($name + '\("(\d+\.\d+\.\d+)\.\d+"\)')) { throw "AssemblyInfo.cs has no $name." }
            if ($Matches[1] -ne $number) { throw "$name is $($Matches[1]) in AssemblyInfo.cs, the tag says $number." }
          }
          if ([regex]::Matches($asm, 'AssemblyInformationalVersion\(').Count -ne 1) { throw 'AssemblyInfo.cs must have exactly one AssemblyInformationalVersion.' }
          if ($asm -notmatch 'AssemblyInformationalVersion\("([^"]+)"\)') { throw 'AssemblyInfo.cs has no AssemblyInformationalVersion.' }
          if ($Matches[1] -cne $version) { throw "AssemblyInformationalVersion is $($Matches[1]) in AssemblyInfo.cs, the tag says $version." }
          foreach ($log in 'CHANGELOG.md', 'CHANGELOG.ru.md') {
            $head = Get-Content $log -Encoding utf8 | Where-Object { $_ -match '^## \[' } | Select-Object -First 2
            if (@($head).Count -lt 2 -or $head[0] -notmatch '^## \[Unreleased\]\s*$') { throw "${log}: the first heading must be '## [Unreleased]'." }
            if ($head[1] -notmatch ('^## \[' + [regex]::Escape($version) + '\] - \d{4}-\d{2}-\d{2}\s*$')) { throw "${log}: the first released heading is '$($head[1])', the tag says $version." }
          }
          Write-Host "Building $version"

      # Only for Dev builds: the stable one has the library neither in the program nor in
      # the package, and there is no point spending minutes on it. Built from source:
      # vcpkg pulls detours and wil, so the step is long. The cache is deliberately
      # not set here: build-native.cmd lays out intermediate files in a temporary
      # folder whose path differs on the builder, and the cache key would point wrong.
      - name: Taskbar styling library
        if: ${{ env.DIIISPL_CHANNEL == 'dev' }}
        run: native\build-native.cmd

      # The certificate is self-made and does not enter the repository. If it is in the secrets,
      # we sign; if not, we build unsigned, but the program will not install such
      # a release: it checks the signature against a known thumbprint.
      - name: Signing certificate
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_PFX)
          $path  = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          $password = ConvertTo-SecureString $env:SIGN_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $path -Force
          "DIIISPL_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # The ".\" is required. For run steps on a windows runner the shell is PowerShell,
      # and it deliberately does not look for executables in the current directory: a bare
      # "build.cmd" ends with "The term is not recognized". The neighboring steps work
      # only because their lines contain a path separator, and PowerShell
      # treats them as a relative path.
      - name: Program
        run: .\scripts\build.cmd ${{ env.DIIISPL_CHANNEL }}

      - name: Installer
        run: .\installer\build-msi.cmd ${{ env.DIIISPL_CHANNEL }}

      # The program will not install an unsigned release: it checks the installer
      # against a known thumbprint. It still builds to the end and goes green,
      # so we check here, before publishing, not after a user complaint.
      - name: Package is signed
        shell: pwsh
        run: |
          $msi = "DIIISPL-$env:DIIISPL_VERSION-$env:DIIISPL_CHANNEL-x64.msi"
          $sig = Get-AuthenticodeSignature $msi

          # We look at the certificate, not at Status: the root is self-signed, and
          # Get-AuthenticodeSignature answers UnknownError on a correctly signed package.
          # Checking by Status would fail every release.
          if ($sig.SignerCertificate -eq $null) {
            throw "Package $msi was built unsigned; the program will not install such a release."
          }

          # And it is the right thumbprint. The program checks the installer against exactly that one
          # (src/Updater.cs), so it rejects a release signed with someone else's key,
          # while a build without this check would go green and publish it.
          $want = '103850469089DEECC19D0DD6CE1D4DD3307601FA'
          if ($sig.SignerCertificate.Thumbprint -ne $want) {
            throw "Package is signed with key $($sig.SignerCertificate.Thumbprint), but the program expects $want."
          }
          Write-Host "Signed: $($sig.SignerCertificate.Thumbprint)"

      # The release description is assembled here, not in the step below: the release page is
      # where the "What's new" button in the program window leads, and the first thing the user
      # should see is what they came for.
      #
      # The page layout is borrowed from Helm: one line on top says what kind of
      # release it is, then "What's new", "Installation and upgrading" with the checksum
      # and signature, "What's next". GitHub appends the commit list with its own
      # "What's Changed", which is the last section.
      #
      # The prose is kept in the .github/release-template.*.md files, only substitutions are here.
      # If a changelog section is missing in even one language, we fail: a release without "what's
      # new" would be created silently and found only by a human eye.
      - name: What's new
        shell: pwsh
        run: |
          function Section([string]$file, [string]$version) {
            if (-not (Test-Path $file)) { throw "File $file not found." }
            $found = $false
            $lines = New-Object System.Collections.Generic.List[string]
            foreach ($line in (Get-Content $file -Encoding utf8)) {
              # Section heading: "## [0.2.2-dev.1] - 2026-08-27". Exactly the form
              # Changelog.Parse shows, so a heading the app cannot show cannot be released.
              # [Unreleased] never equals $version: the tag is checked numeric earlier.
              if ($line -match '^##\s+\[([^\]]+)\]\s*(?:-\s*\d{4}-\d{2}-\d{2})?\s*$') {
                if ($found) { break }
                if ($Matches[1] -eq $version) { $found = $true }
                continue
              }
              if ($found) { $lines.Add($line) }
            }
            if (-not $found) { throw "No section '$version' in $file; add it before pushing the tag." }
            $text = ($lines -join "`n").Trim()
            if ($text -eq '') { throw "Section '$version' in $file is empty." }
            return $text
          }

          $tag = $env:DIIISPL_TAG
          $num = $env:DIIISPL_VERSION
          $msi = "DIIISPL-$num-$env:DIIISPL_CHANNEL-x64.msi"

          # We take the checksum and thumbprint from the package itself, not from what we
          # think about it: the page promises the user they can verify the download, and the promise must
          # refer to the file attached to it.
          $sha = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          $thumb = (Get-AuthenticodeSignature $msi).SignerCertificate.Thumbprint

          $parts = $num.Split('.')
          $nextPatch = "{0}.{1}.{2}" -f $parts[0], $parts[1], ([int]$parts[2] + 1)
          $nextMinor = "{0}.{1}.0"   -f $parts[0], ([int]$parts[1] + 1)

          $ru = Section 'CHANGELOG.ru.md' $tag
          $en = Section 'CHANGELOG.md'    $tag

          # We take the kind of release from the lines themselves, not from the number: 0.2.2 by number is
          # a PATCH, yet it has five features, and the number would lie.
          $hasNew = $en -match '(?m)^### Added\s*$'
          $early = $env:DIIISPL_EARLY -eq 'true'
          $kindRu = if ($hasNew) { 'с новыми возможностями' } else { 'с исправлениями' }
          $kindEn = if ($hasNew) { 'with new features' } else { 'with fixes' }
          $whatRu = if ($early) { "предварительный выпуск канала Dev, $kindRu" } else { "выпуск $kindRu" }
          $whatEn = if ($early) { "a Dev channel pre-release, $kindEn" } else { "a release $kindEn" }

          function Fill([string]$path, [string]$changes, [string]$kind) {
            $t = (Get-Content $path -Raw -Encoding utf8)
            $t = $t.Replace('{VERSION}', $tag).Replace('{KIND}', $kind).Replace('{CHANGES}', $changes)
            $t = $t.Replace('{MSI}', $msi).Replace('{SHA256}', $sha).Replace('{THUMBPRINT}', $thumb)
            $t = $t.Replace('{NEXTPATCH}', $nextPatch).Replace('{NEXTMINOR}', $nextMinor)
            return $t.TrimEnd()
          }

          # English goes entirely below the fold: Helm's page is single-language and therefore
          # short, and two skeletons in a row would make it twice as long for nothing.
          $body = @(
            (Fill '.github/release-template.ru.md' $ru $whatRu), '',
            '<details>', '<summary>English</summary>', '',
            (Fill '.github/release-template.en.md' $en $whatEn), '',
            '</details>'
          ) -join "`n"

          Set-Content release-body.md $body -Encoding utf8
          Write-Host $body

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DIIISPL_TAG }}
          # The title names the channel: the "What's new" button in the program window leads to this
          # page, and not everyone will read the "-dev.1" suffix in the tag.
          name: ${{ env.DIIISPL_CHANNEL == 'dev' && format('{0} · Dev — с панелью задач', env.DIIISPL_TAG) || env.DIIISPL_TAG }}
          prerelease: ${{ env.DIIISPL_EARLY }}
          # We write our own description, in the step above: generate_release_notes assembles text
          # from merged pull requests, and we have none, so the page would greet
          # the user with an empty line. The generated text is appended after; one
          # does not get in the way of the other.
          body_path: release-body.md
          generate_release_notes: true
          files: DIIISPL-${{ env.DIIISPL_VERSION }}-${{ env.DIIISPL_CHANNEL }}-x64.msi
          # Without this, a release without a package is created silently and the step goes green. And a release
          # without a package the program will not install: it looks for an attachment with ".msi".
          fail_on_unmatched_files: true
